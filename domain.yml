version: "3.1"

intents:
  - bot_challenge
  - ask_datacenter
  - ask_admin_datacenter
  - ask_about_insi
  - bertegur_sapa
  - nlu_fallback
  - ask_upload
  - ask_download
  - ask_search_file
  - ask_forgot_password
  - ask_list_homedir
  - ask_login

responses:
  utter_default:
  - text: "Maaf, saya tidak mengerti."
  - text: "Maaf, saya tidak mengerti maksud kamu. Bisa dijelaskan ulang?"

  utter_bertegur_sapa:
  - text: "Halo, saya Bot data center."

  utter_iamabot:
  - text: "Saya Bot data center."

  utter_ask_datacenter:
  - text: "Fasilitas yang digunakan untuk menyimpan data"

  utter_ask_admin_datacenter:
  - text: "Maaf, saya tidak dapat memberikan informasi tersebut."

  utter_ask_about_insi:
  - text: "Baik, untuk mengetahui lebih jauh mengenai perkumpulan inisiatif silahkan anda mengunjungi website https://www.inisiatif.org"

  utter_upload_command:
  - text: "Gunakan perintah /upload."

  utter_download_command:
  - text: "Gunakan perintah /download [no]. Sebelum mengetikan perintah itu, kamu harus cari dulu filenya dengan mengetikan /cari [nama file]"

  utter_search_command:
  - text: "Baik. Untuk mencari sebuah data atau file, gunakan ketik perintah ini: /cari [nama file] atau cukup klik link ini: /cari"

  utter_forgot_password_command:
  - text: "Gunakan perintah /lupa-password"

  utter_list_homedir:
  - text: "Baik. Untuk menampilkan data, gunakan ketika perintah /list atau cukup klik link ini: /list"

  utter_login:
  - text: "Baik. Ketik perintah /login atau cukup klik link ini /login"

actions:
  - action_greeting
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true