version: '3.1'
intents:
- ask_about_guess_name
- ask_about_insi
- ask_admin_datacenter
- ask_datacenter
- ask_download
- ask_search_file
- ask_upload
- bertegur_sapa
- bot_challenge
- ask_to_open
- ask_to_show
- nlu_fallback
- open_file_or_folder
- ask_to_back
- ask_remove_data
- ask_to_remove_current_path
- confirm_remove_data
- deny
- greet_in_english # just for testing
- show_slots
- create_new_folder_with_name
- get_current_path
entities:
- file_no
- folder_name
- search_query
slots:
  file_no:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: file_no
  search_results:
    type: any
    influence_conversation: false
    mappings:
    - type: custom
  current_path:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  root_paths:
    type: any
    influence_conversation: false
    mappings:
    - type: custom
  remove_permitted:
    type: bool
    influence_conversation: false
    initial_value: false
    mappings:
    - type: custom
  folder_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: folder_name
  creation_permitted:
    type: bool
    influence_conversation: true
    initial_value: null
    mappings:
      - type: custom
  # premium_account: # just for testing
  #   type: bool
  #   influence_conversation: true
  #   mappings:
  #   - type: custom
  search_query:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: search_query

forms:
  file_selection_form:
    required_slots:
    - file_no
  # create_folder_form:
  #   required_slots:
  #   - folder_name
responses:
  utter_default:
  - text: Maaf, saya tidak mengerti.
  - text: Maaf, saya tidak mengerti maksud kamu. Bisa dijelaskan ulang?
  utter_iamabot:
  - text: Saya Bot data center.
  utter_ask_datacenter:
  - text: Fasilitas yang digunakan untuk menyimpan data (cloud untuk penyimpanan data perkumpulan inisiatif).
  utter_ask_admin_datacenter:
  - text: Maaf, saya tidak dapat memberikan informasi tersebut.
  utter_ask_about_insi:
  - text: Baik, untuk mengetahui lebih jauh mengenai perkumpulan inisiatif silahkan anda mengunjungi website https://www.inisiatif.org
  utter_upload_command:
  - text: Silakan gunakan perintah /upload.
  utter_download_command:
  - text: Gunakan perintah /download [no]. Sebelum mengetikan perintah itu, kamu harus cari dulu filenya dengan mengetikan /cari [nama file]
  utter_search_command:
  - text: Baik, silakan kirim perintah /list. Nanti kamu bisa mencarinya secara manual dengan membuka satu persatu setiap folder. Atau, bila kamu ingin saya mencarikannya untukmu, silakan kirim perintah /cari.
  utter_ask_file_no:
  - text: Mau akses nomor berapa?
  utter_ask_confirm_remove_data:
  - text: Apakah kamu sudah yakin untuk menghapus?
  - text: Yakin mau dihapus?
  - text: Beneran nih mau dihapus?
  utter_ask_deny_remove_data:
  - text: Ok,
  - text: Okeh
  - text: Siap!
  - text: Siap komandan!
  # just for testing
  utter_premium_account:
    - text: Hallo premium account
  utter_basic_account:
    - text: Hallo basic account
  utter_when_to_upgrade:
    - text: Kapan kamu akan upgrade account?
  utter_ask_folder_name:
    - text: Apa nama foldernya?
  utter_folder_exists:
    - text: "Maaf, folder dengan nama '{folder_name}' sudah ada di lokasi saat ini. Mohon berikan nama yang berbeda."
  utter_permission_denied_create_folder:
    - text: "Maaf, kamu tidak memiliki izin membuat folder di lokasi ini : '{current_path}'"
  utter_folder_created_success:
    - text: "Folder '{folder_name}' berhasil dibuat di '{current_path}'"
  utter_create_folder_failed:
    - text: "Gagal membuat '{folder_name}'. Terjadi kesalahan."
  utter_submit: 
    - text: Baik form telah selesai.
  utter_slots_values:
    - text: "Berikut adalah nilai slot Anda saat ini:\n{slot_values}"
actions:
- action_greeting
- action_guessing_name
- action_show_data
- validate_file_selection_form
- action_to_open_data
- action_back_to_previous
- action_remove_data
- action_to_remove_current_path
- action_check_permission_remove_data
- action_check_user_profile # just for testing
- action_create_folder
- validate_create_folder_form
- action_perform_search
- action_perform_download
- action_get_current_path
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
