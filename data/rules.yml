version: "3.1"

rules:
- rule: Falback rule
  steps:
  - intent: nlu_fallback
  - action: utter_default

# - rule: Bertegur sapa
#   steps:
#     - intent: bertegur_sapa
#     - action: action_greeting

- rule: Ask about guessing name
  steps:
    - intent: ask_about_guess_name
    - action: action_guessing_name

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Response for question about data center
  steps:
  - intent: ask_datacenter
  - action: utter_ask_datacenter

- rule: Response for question about admin data center
  steps:
    - intent: ask_admin_datacenter
    - action: utter_ask_admin_datacenter

- rule: Response for question about inisiatif
  steps:
    - intent: ask_about_insi
    - action: utter_ask_about_insi

- rule: How to download
  steps:
    - intent: ask_download
    - action: utter_download_command

- rule: How to upload
  steps:
    - intent: ask_upload
    - action: utter_upload_command

- rule: How to search file
  steps:
    - intent: ask_search_file
    - action: utter_search_command

- rule: How to reset password
  steps:
    - intent: ask_forgot_password
    - action: utter_forgot_password_command

# - rule: How to list my files
#   steps:
#     - intent: i_want_to_see_my_data
#     - action: action_open_selected_data

# - rule: Respon setelah user pilih menu
#   steps:
#     - intent: choose_file_no
#     - action: action_access_data

- rule: Open user workspaces
  steps:
    - intent: i_want_to_see_my_data
    - action: action_list_workspace
    - action: file_selection_form # mengaktifkan form
    - active_loop: file_selection_form

- rule: Handle open folder or file
  condition:
    - active_loop: file_selection_form
  steps:
    - action: file_selection_form
    - active_loop: null
    - slot_was_set:
      - file_no
    - action: action_open_selected_data

- rule: Reactivate file_select_form after opening file
  steps:
    - action: action_open_selected_data
    - action: file_selection_form
    - active_loop: file_selection_form

