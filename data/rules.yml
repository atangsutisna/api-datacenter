version: "3.1"

rules:
- rule: Falback rule
  steps:
  - intent: nlu_fallback
  - action: utter_default

- rule: Bertegur sapa
  steps:
    - intent: bertegur_sapa
    - action: action_greeting

- rule: Ask about guessing name
  steps:
    - intent: ask_about_guess_name
    - action: action_guessing_name

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Response for question about data center
  steps:
  - intent: ask_datacenter
  - action: utter_ask_datacenter

- rule: Response for question about admin data center
  steps:
    - intent: ask_admin_datacenter
    - action: utter_ask_admin_datacenter

- rule: Response for question about inisiatif
  steps:
    - intent: ask_about_insi
    - action: utter_ask_about_insi

# User want to download,
#todo: refactor, outsource to celery
- rule: User want download file
  steps:
    - intent: ask_download
    - action: action_prepare_download
    - slot_was_set:
      - file_no: not null
      - has_download_permission: true
    - action: action_start_download

- rule: Kirim link download setelah proses selesai
  steps:
    - action: action_perform_download
    - action: utter_download_done

- rule: User has no permission to download
  steps:
    - intent: ask_download
    - action: action_prepare_download
    - slot_was_set:
        - file_no: not null
        - has_download_permission: false
    - action: utter_no_download_permission
# end of download

- rule: How to upload
  steps:
    - intent: ask_upload
    - action: utter_upload_command
# search a file with keyword
# - rule: User want to search a file or data
#   steps:
#     - intent: request_search_file
#     - slot_was_set:
#       - search_query: not null
#     - action: action_perform_search
# - rule: setelah bot menyelesaikan pencarian
#   steps:
#     - action: action_perform_search
#     - action: action_listen
- rule: User want to search a file
  steps:
    - intent: request_search_file
    - action: search_form
    - active_loop: search_form

- rule: Submit search form
  condition:
    - active_loop: search_form
  steps:
    - action: search_form
    - active_loop: null
    - action: action_perform_search

- rule: User meminta untuk menampilkan data yang ada di workspacenya
  steps:
    - intent: ask_to_show
    - action: action_show_data

- rule: User meminta untuk membuka file atau folder
  condition:
    - slot_was_set:
        - search_results: not null
  steps:
    - intent: ask_to_open
    # - action: action_notify_processing
    - action: action_to_open_data

- rule: User meminta untuk balik ke lagi ke path sebelumnya
  condition:
    - slot_was_set:
        - current_path: not null
  steps:
    - intent: ask_to_back
    - action: action_back_to_previous
# - rule: Respon setelah user pilih menu
#   steps:
#     - intent: choose_file_no
#     - action: action_to_open_data
# - rule: create new folder
#   steps:
#     - intent: create_new_folder
#     - action: create_folder_form
#     - active_loop: create_folder_form
# - rule: submit create folder
#   condition:
#     - active_loop: create_folder_form
#   steps:
#   - action: create_folder_form
#   - active_loop: null
#   - slot_was_set:
#       - folder_name: null
#   - action: action_create_folder
# - rule: user has not permission to write folder
#   condition:
#     - slot_was_set:
#       - creation_permitted: false
#   steps:
#     - action: create_folder_form
#     - active_loop: null
#     - action: utter_permission_denied_create_folder
- rule: user want to an empty folder
  steps:
  - intent: create_new_folder_with_name
  - slot_was_set:
      - folder_name: not null
  - action: action_create_folder
- rule: setelah user membuat folder, ucapkan sesuatu dan listen
  steps:
  - action: action_create_folder
  - action: action_listen
- rule: show all slot values
  steps:
  - intent: show_slots
  - action: utter_slots_values
- rule: get current path
  steps:
  - intent: get_current_path
  - action: action_get_current_path

# command untuk menghapus data
- rule: user want to remove data
  steps:
  - intent: ask_remove_data
  - action: action_prepare_remove
  - slot_was_set:
      - has_rm_permission: true
  - action: utter_ask_confirm_remove_data
  - slot_was_set:
      - file_no_to_be_removed: not null

- rule: user confirm to remove data
  condition:
    - slot_was_set:
      - file_no_to_be_removed: not null
  steps:
    - intent: confirm_remove_data
    - action: action_remove_data

- rule: after data removal
  steps:
    - action: action_remove_data
    - action: action_listen

- rule: user membatalkan penghapusan data
  condition:
    - active_loop: null
    - slot_was_set:
      - file_no_to_be_removed: not null
  steps:
    - intent: deny
    - action: utter_ask_deny_remove_data
    - action: action_listen

- rule: User has no permission to remove
  steps:
    - intent: ask_remove_data
    - action: action_prepare_remove
    - slot_was_set:
        - has_rm_permission: false
    - action: utter_no_rm_permission
# end of rule remove data

# rename  a folder or file
# - rule: User want to rename a file or folder
#   steps:
#     - intent: rename_item_by_file_no
#     - action: action_prepare_rename
#     - action: rename_form
#     - active_loop: rename_form
# - rule: Selesaikan rename file
#   condition:
#     - active_loop: rename_form
#   steps:
#     - action: rename_form
#     - active_loop: null
#     - action: action_do_rename

# - rule: Konfirmasi rename setelah form selesai
#   condition:
#     - active_loop: rename_form
#   steps:
#     - action: rename_form
#     - active_loop: null
#     - action: action_do_rename

- rule: User has permission to rename
  steps:
    - intent: rename_item_by_file_no
    - action: action_prepare_rename
    - slot_was_set:
        - has_rename_permission: true
    - action: rename_form
    - active_loop: rename_form
    - active_loop: null
    - action: action_do_rename
    
- rule: User has no permission to rename
  steps:
    - intent: rename_item_by_file_no
    - action: action_prepare_rename
    - slot_was_set:
        - has_rename_permission: false
    - action: utter_no_rename_permission
# go home / ke beranda
- rule: Pergi ke halaman home/workspace
  steps:
    - intent: ask_to_home
    - action: action_go_home

# user want to compress a folder
- rule: user has permission to zip a folder
  steps:
  - intent: zip_folder
  - action: action_prepare_zip
  - slot_was_set:
      - file_no: not null
      - has_zip_permission: true
  - action: action_zip

- rule: Infokan bila proses zip selesai
  steps:
    - action: action_zip
    - action: utter_zip_done

- rule: User has no permission to zip
  steps:
    - intent: zip_folder
    - action: action_prepare_zip
    - slot_was_set:
        - file_no: not null
        - has_zip_permission: false
    - action: utter_no_zip_permission

# long running task
- rule: Run long running task
  steps:
    - intent: run_long_running_task
    - action: action_long_run_task

- rule: Check status zip
  steps:
    - intent: check_zip_status
    - action: utter_zip_done

# move a file or folder
- rule: User want to move a file or folder
  steps:
    - intent: user_want_to_move_a_file
    - action: action_confirm_move_file

- rule: User want save a moved file or folder to current path
  steps:
    - intent: simpan_di_lokasi_saat_ini
    - action: action_move_here