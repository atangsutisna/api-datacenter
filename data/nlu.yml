    - bisa bantu cara unduh file?
    - langkah-langkah untuk download gimana ya?
    - saya tidak tahu cara download
    - bisa bantu saya download?

- intent: ask_search_file
  examples: |
    - saya ingin mencari file
    - bagaimana cara mencari file?
    - cari file dong
    - saya butuh file tertentu
    - tolong bantu cari file
