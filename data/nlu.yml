- intent: ask_datacenter
  examples: |
    - apa itu data center?
    - data center itu apa ya?
    - apaan sih data center?
    - apa yang dimaksud dengan data center?
    - data center itu apa?

- intent: ask_admin_datacenter
  examples: |
    - siapa sih adminnya?
    - siapa admin data center?
    - adminnya siapa?
    - tolong infokan adminnya
    - bisa kasih tau adminnya?

- intent: ask_about_insi
  examples: |
    - inisiatif itu apa ya?
    - apa itu inisiatif?
    - tolong jelaskan, inisiatif itu apa?
