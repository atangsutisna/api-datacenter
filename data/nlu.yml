    - bisa bantu ulang atur kata sandi?
    - lupa login
    - gimana cara reset password
    - saya kehilangan akses karena lupa password
    - bantu reset password saya dong

- intent: i_want_to_see_my_data
  examples: |
    - tampilkan semua data saya
    - saya punya data apa saja?
    - minta daftar data saya dong
    - bisa tunjukan semua file dan folder saya?
    - apa saja isi penyimpanan saya?
